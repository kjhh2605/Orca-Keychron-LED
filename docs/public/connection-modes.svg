ont-size="22" fill="#B6BFCC" font-weight="650" text-anchor="middle">BT</text><text x="427" y="457" font-size="22" fill="#B6BFCC" font-weight="650" text-anchor="middle">Off</text><rect x="476" y="425" width="90" height="48" rx="9" fill="#FFB477"/><text x="521" y="457" font-size="22" fill="#101319" font-weight="650" text-anchor="middle">Cable</text><text x="68" y="511" font-size="23" fill="#F4F5F7" font-weight="600" text-anchor="start">키맵 백업은 Cable, 펌웨어 작업은 DFU</text><text x="68" y="554" font-size="21" fill="#B6BFCC" font-weight="400" text-anchor="start">쓰기·읽기 검증·USB 복귀까지 케이블 유지</text><text x="68" y="589" font-size="21" fill="#B6BFCC" font-weight="400" text-anchor="start">충전 전용 케이블로는 설치할 수 없습니다.</text><text x="68" y="654" font-size="19" fill="#FFB477" font-weight="600" text-anchor="start">Bluetooth로 펌웨어를 설치하지 않습니다.</text><rect x="652" y="183" width="588" height="514" rx="22" fill="#1A2029" stroke="#343C48"/><text x="680" y="224" font-size="19" fill="#6DDFC9" font-weight="700" text-anchor="start">02  무선 사용</text><text x="680" y="266" font-size="29" fill="#F4F5F7" font-weight="700" text-anchor="start">상태 조명 · F키 이동 · 색상 조정</text><rect x="689" y="303" width="142" height="91" rx="9" fill="#293340" stroke="#343C48"/><rect x="698" y="312" width="124" height="69" rx="3" fill="#131820"/><line x1="677" y1="405" x2="843" y2="405" stroke="#B6BFCC" stroke-width="6"/><text x="760" y="352" font-size="23" fill="#F4F5F7" font-weight="600" text-anchor="middle">Mac</text><rect x="1016" y="321" width="182" height="76" rx="10" fill="#252D38" stroke="#343C48"/><rect x="1026" y="331" width="12" height="12" rx="2" fill="#6DDFC9"/><rect x="1042" y="331" width="12" height="12" rx="2" fill="#6DDFC9"/><rect x="1058" y="331" width="12" height="12" rx="2" fill="#6DDFC9"/><rect x="1074" y="331" width="12" height="12" rx="2" fill="#6DDFC9"/><rect x="1090" y="331" width="12" height="12" rx="2" fill="#6DDFC9"/><rect x="1106" y="331" width="12" height="12" rx="2" fill="#6DDFC9"/><rect x="1122" y="331" width="12" height="12" rx="2" fill="#6DDFC9"/><rect x="1138" y="331" width="12" height="12" rx="2" fill="#6DDFC9"/><rect x="1154" y="331" width="12" height="12" rx="2" fill="#6DDFC9"/><rect x="1170" y="331" width="12" height="12" rx="2" fill="#6DDFC9"/><rect x="1026" y="348" width="12" height="12" rx="2" fill="#687482"/><rect x="1042" y="348" width="12" height="12" rx="2" fill="#687482"/><rect x="1058" y="348" width="12" height="12" rx="2" fill="#687482"/><rect x="1074" y="348" width="12" height="12" rx="2" fill="#687482"/><rect x="1090" y="348" width="12" height="12" rx="2" fill="#687482"/><rect x="1106" y="348" width="12" height="12" rx="2" fill="#687482"/><rect x="1122" y="348" width="12" height="12" rx="2" fill="#687482"/><rect x="1138" y="348" width="12" height="12" rx="2" fill="#687482"/><rect x="1154" y="348" width="12" height="12" rx="2" fill="#687482"/><rect x="1170" y="348" width="12" height="12" rx="2" fill="#687482"/><rect x="1026" y="365" width="12" height="12" rx="2" fill="#687482"/><rect x="1042" y="365" width="12" height="12" rx="2" fill="#687482"/><rect x="1058" y="365" width="12" height="12" rx="2" fill="#687482"/><rect x="1074" y="365" width="12" height="12" rx="2" fill="#687482"/><rect x="1090" y="365" width="12" height="12" rx="2" fill="#687482"/><rect x="1106" y="365" width="12" height="12" rx="2" fill="#687482"/><rect x="1122" y="365" width="12" height="12" rx="2" fill="#687482"/><rect x="1138" y="365" width="12" height="12" rx="2" fill="#687482"/><rect x="1154" y="365" width="12" height="12" rx="2" fill="#687482"/><rect x="1170" y="365" width="12" height="12" rx="2" fill="#687482"/><rect x="1062" y="383" width="92" height="6" rx="2" fill="#687482"/><line x1="842" y1="357" x2="1014" y2="357" stroke="#6DDFC9" stroke-width="4" stroke-dasharray="7 8"/><text x="928" y="334" font-size="16" fill="#6DDFC9" font-weight="600" text-anchor="middle">Bluetooth</text><text x="687" y="455" font-size="18" fill="#B6BFCC" font-weight="400" text-anchor="start">연결 모드</text><rect x="896" y="421" width="286" height="56" rx="12" fill="#10151C"/><rect x="900" y="425" width="90" height="48" rx="9" fill="#6DDFC9"/><text x="945" y="457" font-size="22" fill="#101319" font-weight="650" text-anchor="middle">BT</text><text x="1039" y="457" font-size="22" fill="#B6BFCC" font-weight="650" text-anchor="middle">Off</text><text x="1133" y="457" font-size="22" fill="#B6BFCC" font-weight="650" text-anchor="middle">Cable</text><text x="680" y="511" font-size="23" fill="#F4F5F7" font-weight="600" text-anchor="start">Mac에 Bluetooth 연결 후 연동 시작</text><text x="680" y="554" font-size="21" fill="#B6BFCC" font-weight="400" text-anchor="start">충전 케이블을 꽂아도 스위치는 BT</text><text x="680" y="589" font-size="21" fill="#B6BFCC" font-weight="400" text-anchor="start">설정 앱에서 저장하면 무선으로 전달됩니다.</text><text x="680" y="654" font-size="19" fill="#6DDFC9" font-weight="600" text-anchor="start">현재 일상 연동은 Bluetooth용입니다.</text><rect x="40" y="719" width="1200" height="65" rx="15" fill="#242B33"/><text x="640" y="760" font-size="25" fill="#F4F5F7" font-weight="650" text-anchor="middle">색상·밝기·효과만 바꿀 때는 펌웨어 재설치가 필요 없습니다.</text><text x="44" y="811" font-size="16" fill="#B6BFCC" font-weight="400" text-anchor="start">스위치 그림은 모드 설명용입니다. 실제 제품의 위치와 비율을 재현한 사진이 아닙니다.</text></g></svg>
