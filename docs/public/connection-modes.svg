<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="838" viewBox="0 0 1280 838" role="img" aria-labelledby="title desc"><title id="title">설치는 USB, 평소에는 Bluetooth</title><desc id="desc">왼쪽: 펌웨어 설치와 복구는 USB 데이터 케이블과 Cable 및 DFU 모드가 필요합니다. 오른쪽: 일상 연동과 색상 변경은 BT 모드에서 사용합니다.</desc><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1280" height="838" rx="24" fill="#101319"/><text x="44" y="51" font-size="18" fill="#B6BFCC" font-weight="650" text-anchor="start">ORCA × KEYCHRON  /  연결 방식</text><text x="44" y="106" font-size="42" fill="#F4F5F7" font-weight="750" text-anchor="start">설치는 USB, 평소에는 Bluetooth.</text><text x="44" y="145" font-size="22" fill="#B6BFCC" font-weight="400" text-anchor="start">K10 Pro ANSI RGB · 케이블 연결과 스위치 모드는 별개입니다.</text><rect x="40" y="183" width="588" height="514" rx="22" fill="#1A2029" stroke="#343C48"/><text x="68" y="224" font-size="19" fill="#FFB477" font-weight="700" text-anchor="start">01  USB 필수</text><text x="68" y="266" font-size="29" fill="#F4F5F7" font-weight="700" text-anchor="start">설치 · 업데이트 · 원본 복구</text><rect x="77" y="303" width="142" height="91" rx="9" fill="#293340" stroke="#343C48"/><rect x="86" y="312" width="124" height="69" rx="3" fill="#131820"/><line x1="65" y1="405" x2="231" y2="405" stroke="#B6BFCC" stroke-width="6"/><text x="148" y="352" font-size="23" fill="#F4F5F7" font-weight="600" text-anchor="middle">Mac</text><rect x="404" y="321" width="182" height="76" rx="10" fill="#252D38" stroke="#343C48"/><rect x="414" y="331" width="12" height="12" rx="2" fill="#FFB477"/><rect x="430" y="331" width="12" height="12" rx="2" fill="#FFB477"/><rect x="446" y="331" width="12" height="12" rx="2" fill="#FFB477"/><rect x="462" y="331" width="12" height="12" rx="2" fill="#FFB477"/><rect x="478" y="331" width="12" height="12" rx="2" fill="#FFB477"/><rect x="494" y="331" width="12" height="12" rx="2" fill="#FFB477"/><rect x="510" y="331" width="12" height="12" rx="2" fill="#FFB477"/><rect x