<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="950" viewBox="0 0 1280 950" role="img" aria-labelledby="title desc"><title id="title">USB 펌웨어 설치에서 Bluetooth 사용까지</title><desc id="desc">중지와 모델 확인, USB Cable 백업, Reset DFU 진입, 설치 및 읽기 검증, 정상 USB 복귀와 설정 확인, Bluetooth 연동의 여섯 단계입니다.</desc><g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="0" y="0" width="1280" height="950" rx="24" fill="#101319"/><text x="44" y="51" font-size="18" fill="#B6BFCC" font-weight="650" text-anchor="start">ORCA × KEYCHRON  /  펌웨어 작업 순서</text><text x="44" y="106" font-size="38" fill="#F4F5F7" font-weight="750" text-anchor="start">USB로 설치하고, 확인 후 BT로 전환합니다.</text><text x="44" y="146" font-size="22" fill="#B6BFCC" font-weight="400" text-anchor="start">첫 커스텀 설치 · 업데이트 순서 / 원본 복원은 별도 안내를 따릅니다.</text><rect x="40" y="189" width="380" height="185" rx="18" fill="#1A2029" stroke="#343C48"/><rect x="62" y="209" width="38" height="38" rx="10" fill="#FFB477"/><text x="81" y="236" font-size="23" fill="#101319" font-weight="750" text-anchor="middle">1</text><text x="114" y="237" font-size="25" fill="#F4F5F7" font-weight="700" text-anchor="start">중지 · 모델 확인</text><text x="63" y="289" font-size="21" fill="#B6BFCC" font-weight="400" text-anchor="start">LED 메뉴에서 연동 중지</text><text x="63" y="325" font-size="21" fill="#B6BFCC" font-weight="400" text-anchor="start">K10 Pro ANSI RGB 대상 확인</text><line x1="426" y1="281" x2="444" y2="281" stroke="#B6BFCC" stroke-width="3"/><path d="M436,274 L444,281 L436,288" fill="none" stroke="#B6BFCC" stroke-width="3"/><rect x="450" y="189" width="380" height="185" rx="18" fill="#1A2029" stroke="#343C48"/><rect x="472" y="209" width="38" height="38" rx="10" fill="#FFB477"/><text x="491" y="236" font-size="23" fill="#101319" font-weight="750" text-anchor="middle">2</text><text x="524" y="237" font-size="25" fill="#F4F5F7" font-weight="700" text-anchor="start">USB · Cable · 백업</text><text x="473" y="289" font-size="21" fill="#B6BFCC" font-weight="400" text-anchor="start">USB 데이터 케이블 연결</text><text x="473" y="325" font-size="21" fill="#B6BFCC" font-weight="400" text-anchor="start">키맵·매크로·조명 백업</text><line x1="836" y1="281" x2="854" y2="281" stroke="#B6BFCC" stroke-width="3"/><path d="M846,274 L854,281 L846,288" fill="none" stroke="#B6BFCC" stroke-width="3"/><rect x="860" y="189" width="380" height="185" rx="18" fill="#1A2029" stroke="#343C48"/><rect x="882" y="209" width="38" height="38" rx="10" fill="#FFB477"/><text x="901" y="236" font-size="23" fill="#101319" font-weight="750" text-anchor="middle">3</text><text x="934" y="237" font-size="25" fill="#F4F5F7" font-weight="700" text-anchor="start">Reset · DFU 확인</text><text x="883" y="289" font-size="21" fill="#B6BFCC" font-weight="400" text-anchor="start">정확한 DFU 장치 확인</text><text x="883" y="325" font-size="21" fill="#B6BFCC" font-weight="400" text-anchor="start">첫 설치: 원본 2회 읽기·검증</text><rect x="40" y="409" width="380" height="185" rx="18" fill="#1A2029" stroke="#343C48"/><rect x="62" y="429" width="38" height="38" rx="10" fill="#FFB477"/><text x="81" y="456" font-size="23" fill="#101319" font-weight="750" text-anchor="middle">4</text><text x="114" y="457" font-size="25" fill="#F4F5F7" font-weight="700" text-anchor="start">설치 · 읽기 검증</text><text x="63" y="509" font-size="21" fill="#B6BFCC" font-weight="400" text-anchor="start">검증된 이미지와 증거로 기록</text><text x="63" y="545" font-size="21" fill="#B6BFCC" font-weight="400" text-anchor="start">쓴 내용을 다시 읽어 일치 확인</text><line x1="426" y1="501" x2="444" y2="501" stroke="#B6BFCC" stroke-width="3"/><path d="M436,494 L444,501 L436,508" fill="none" stroke="#B6BFCC" stroke-width="3"/><rect x="450" y="409" width="380" height="185" rx="18" fill="#1A2029" stroke="#343C48"/><rect x="472" y="429" width="38" height="38" rx="10" fill="#FFB477"/><text x="491" y="456" font-size="23" fill="#101319" font-weight="750" text-anchor="middle">5</text><text x="524" y="457" font-size="25" fill="#F4F5F7" font-weight="700" text-anchor="start">USB 정상 복귀 확인</text><text x="473" y="509" font-size="21" fill="#B6BFCC" font-weight="400" text-anchor="start">키맵·매크로·조명 전후 비교</text><text x="473" y="545" font-size="21" fill="#B6BFCC" font-weight="400" text-anchor="start">일반 키·테마 지원 응답 확인</text><line x1="836" y1="501" x2="854" y2="501" stroke="#B6BFCC" stroke-width="3"/><path d="M846,494 L854,501 L846,508" fill="none" stroke="#B6BFCC" stroke-width="3"/><rect x="860" y="409" width="380" height="185" rx="18" fill="#1A2029" stroke="#343C48"/><rect x="882" y="429" width="38" height="38" rx="10" fill="#6DDFC9"/><text x="901" y="456" font-size="23" fill="#101319" font-weight="750" text-anchor="middle">6</text><text x="934" y="457" font-size="25" fill="#F4F5F7" font-weight="700" text-anchor="start">BT · 연동 시작</text><text x="883" y="509" font-size="21" fill="#B6BFCC" font-weight="400" text-anchor="start">평소 채널로 Mac에 연결</text><text x="883" y="545" font-size="21" fill="#B6BFCC" font-weight="400" text-anchor="start">실제 LED·이동·최소화 확인</text><line x1="1254" y1="281" x2="1268" y2="281" stroke="#B6BFCC" stroke-width="3"/><line x1="1268" y1="281" x2="1268" y2="391" stroke="#B6BFCC" stroke-width="3"/><line x1="1268" y1="391" x2="26" y2="391" stroke="#B6BFCC" stroke-width="3"/><line x1="26" y1="391" x2="26" y2="501" stroke="#B6BFCC" stroke-width="3"/><line x1="26" y1="501" x2="37" y2="501" stroke="#B6BFCC" stroke-width="3"/><path d="M29,494 L37,501 L29,508" fill="none" stroke="#B6BFCC" stroke-width="3"/><rect x="40" y="617" width="1200" height="176" rx="18" fill="#242B33"/><text x="66" y="655" font-size="24" fill="#FFB477" font-weight="700" text-anchor="start">DFU 진입: 이 프로젝트에서 확인한 K10 Pro 방법</text><text x="66" y="696" font-size="23" fill="#F4F5F7" font-weight="600" text-anchor="start">USB 연결 유지 → Off → Reset을 누른 채 Cable → DFU 감지 확인 → Reset 놓기</text><text x="66" y="734" font-size="22" fill="#B6BFCC" font-weight="400" text-anchor="start">Reset은 스페이스바 키캡 아래, 스위치 왼쪽 PCB의 작은 버튼입니다.</text><text x="66" y="768" font-size="21" fill="#B6BFCC" font-weight="400" text-anchor="start">이 절차에서는 Esc 부팅이나 공장 초기화를 사용하지 않습니다.</text><rect x="40" y="817" width="1200" height="70" rx="15" fill="#3B2B24"/><text x="640" y="861" font-size="23" fill="#FFD3AC" font-weight="650" text-anchor="middle">설치·읽기 검증·USB 정상 복귀를 마치기 전에는 케이블을 빼거나 BT로 바꾸지 마세요.</text><text x="44" y="920" font-size="16" fill="#B6BFCC" font-weight="400" text-anchor="start">단계 설명용 도식 · 설치 명령은 장치 식별과 백업 검증 후 실행합니다. 실물 사진이 아닙니다.</text></g></svg>
